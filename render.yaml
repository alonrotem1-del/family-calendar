services:
  - type: web
    name: family-calendar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.asgi:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: FAMILY_PASSWORD
        sync: false
      # The secret iCal links. Names and colors live in family.yaml.
      - key: FEED_ABA
        sync: false
      - key: FEED_IMA
        sync: false
      # Where events added in the app are kept (Neon's free Postgres).
      - key: DATABASE_URL
        sync: false
