services:
  - type: web
    name: family-calendar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.asgi:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: FAMILY_PASSWORD
        sync: false
      - key: CAL_1_NAME
        value: אבא
      - key: CAL_1_URL
        sync: false
      - key: CAL_2_NAME
        value: אמא
      - key: CAL_2_URL
        sync: false
      - key: CAL_3_NAME
        value: חוגים
      - key: CAL_3_URL
        sync: false
