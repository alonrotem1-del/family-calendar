# המשפחה: מי מופיע באפליקציה, באיזה צבע, ומאיפה מגיעים האירועים שלו.
#
# לכל אחד יכולים להיות:
#   - יומן חיצוני (Outlook / Google). הקישור הסודי לא נכתב כאן אלא ב-Render,
#     במשתנה FEED_ ואחריו ה-id באותיות גדולות. למשל לאבא: FEED_ABA
#   - חוגים קבועים שנכתבים כאן (activities)
#
# דוגמה לחוג:
#   - title: כדורגל
#     day: שלישי               # או כמה ימים: [שני, רביעי]
#     time: "16:30-17:30"       # עם מרכאות!
#     location: מגרש העירוני    # לא חובה
#     from: 2026-09-01          # לא חובה: מאיזה תאריך
#     until: 2027-06-20         # לא חובה: עד איזה תאריך
#     skip: [2026-12-15]        # לא חובה: ימים שאין חוג (חגים, חופשות)

people:
