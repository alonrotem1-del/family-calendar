# המשפחה: מי מופיע באפליקציה, באיזה צבע, ומאיפה מגיעים האירועים שלו.
#
# לכל אחד יכולים להיות:
#   - יומן חיצוני (Outlook / Google). הקישור הסודי לא נכתב כאן אלא ב-Render,
#     במשתנה FEED_ ואחריו ה-id באותיות גדולות. למשל לאבא: FEED_ABA
#   - חוגים קבועים שנכתבים כאן (activities)
#
# דוגמה לחוג:
#   - title: כדורגל
#     day: שלישי               # או כמה ימים: [שני, רביעי]
#     time: "16:30-17:30"       # עם מרכאות!
#     location: מגרש העירוני    # לא חובה
#     from: 2026-09-01          # לא חובה: מאיזה תאריך
#     until: 2027-06-20         # לא חובה: עד איזה תאריך
#     skip: [2026-12-15]        # לא חובה: ימים שאין חוג (חגים, חופשות)
#
# מערכת שעות (school): לכל יום, המקצועות לפי סדר השיעורים. הראשון הוא שיעור 1,
# "" הוא שיעור חופשי, ושם המורה בסוגריים: אומנות (ענת)

people:
  - id: ima
    name: אמא
    color: "#7c3aed"   # סגול
    # היומן מ-Google: FEED_IMA

  - id: aba
    name: אבא
    color: "#eab308"   # צהוב
    # היומן מ-Outlook של העבודה: FEED_ABA

  - id: yuli
    name: יולי
    color: "#ec4899"   # ורוד
    activities:
      - title: היפ הופ
        day: ראשון
        time: "16:45-19:15"

      - title: היפ הופ
        day: שני
        time: "15:30-18:00"

      - title: היפ הופ
        day: רביעי
        time: "16:00-17:00"

      - title: היפ הופ
        day: חמישי
        time: "16:15-17:15"
    school:   # כיתה ה'4
      ראשון: [אנגלית, מתמטיקה, מדעים, גיאומטריה, שפה, אנגלית]
      שני: [שפה, מתמטיקה, אנגלית, חנ"ג, כישורי חיים, תרבות יהודית ישראלית]
      שלישי: [שפה, חנ"ג, מחול, שפה, מדעים]
      רביעי: [נקודות מב"ע, נקודות מב"ע, מדעים, תנ"ך, תנ"ך]
      חמישי: [שפה, מתמטיקה, אנגלית, שפה, גיאוגרפיה, זה"ב]
      שישי: [שפה, מתמטיקה, כישורי חיים, מפתח הלב]

  - id: leo
    name: ליאו
    color: "#2563eb"   # כחול
    activities:
      - title: כדורגל
        day: חמישי
        time: "17:20-18:10"
        location: גן שמואל
    school:   # כיתה ב'1
      ראשון: [שפה, שפה, תורה, חינוך גופני (אביר), שעשועי אנגלית]
      שני: [חשבון, כישורי חיים (נגה), מדעים (בר), שפה, חשבון]
      שלישי: [העשרה (שיר), מדעים (בר), מדעים (בר), אשכולות חשיבה (בר), חינוך גופני (אביר)]
      רביעי: [תורה, חשבון, חשבון, שפה, שבילי מורשת]
      חמישי: [שפה, עידוד קריאה (נגה), אמנות (ענת), אמנות (ענת), מולדת]
      שישי: [חשבון, מדעים, מוזיקה (ענת), מפתח הלב]

  - id: romi
    name: רומי
    color: "#16a34a"   # ירוק
    activities:
      - title: אקרויוגה
        day: [ראשון, רביעי]
        time: "17:00-18:00"
        location: רבין

      - title: כדורגל
        day: חמישי
        time: "17:30-18:20"
        location: גן שמואל
    school:   # כיתה א'1
      ראשון: [שפה, מדעים, חינוך גופני (אביר), מדעים, שפה]
      שני: [חשבון, שפה, שעשועי אנגלית (אורטל), שפה, שפה]
      שלישי: [שפה, משחקי חצר (אביר), עידוד קריאה (שיר), חינוך גופני (אביר), שפה]
      רביעי: [חשבון, מפתח הלב (שיר), חשבון, שפה, למידה בחברותא]
      חמישי: [אומנות (ענת), אומנות (ענת), שעשועי אנגלית (אורטל), אשכולות חשיבה (אורטל), זה"ב (רננה)]
      שישי: [חשבון, מוזיקה (ענת), שפה, כישורי חיים]
