<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>יומן משפחתי</title>
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="יומן משפחתי">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <img src="/icons/icon.svg" alt="" width="64" height="64">
      <h1>יומן משפחתי</h1>
      <label for="password">סיסמת המשפחה</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">כניסה</button>
      <p id="login-error" class="login-error" role="alert"></p>
    </form>
  </section>

  <main id="app" hidden>
    <section id="calendar-tab" class="tab-panel">
    <header class="toolbar">
      <div class="nav">
        <!-- SVG rather than ‹ ›, which some browsers mirror in RTL and some don't -->
        <button id="prev" class="icon-btn" aria-label="הקודם">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="today" class="today-btn">היום</button>
        <button id="next" class="icon-btn" aria-label="הבא">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <h1 id="range" class="range"></h1>
      <button id="refresh" class="icon-btn" aria-label="רענון">⟳</button>
    </header>

    <div id="cal-views" class="view-toggle" role="group" aria-label="תצוגה">
      <button type="button" data-view="day">יום</button>
      <button type="button" data-view="workweek">שבוע עבודה</button>
      <button type="button" data-view="week">שבוע</button>
    </div>
    <nav id="filters" class="filters" aria-label="סינון לפי בן משפחה"></nav>
    <div id="notices" class="notices" role="status"></div>

    <div id="scroller" class="scroller">
      <div id="cal-head" class="cal-head"></div>
      <div id="cal-body" class="cal-body"></div>
      <footer class="footer">
        <span id="updated"></span>
        <button id="logout" class="link-btn">יציאה</button>
      </footer>
    </div>
    </section>

    <!-- The children's school timetable: like the calendar, without the parents -->
    <section id="school-tab" class="tab-panel" hidden>
      <header class="toolbar">
        <div id="school-nav" class="nav">
          <button id="school-prev" class="icon-btn" aria-label="היום הקודם">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="school-today" class="today-btn">היום</button>
          <button id="school-next" class="icon-btn" aria-label="היום הבא">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <h1 id="school-title" class="range">מערכת שעות</h1>
      </header>
      <div id="school-views" class="view-toggle" role="group" aria-label="תצוגה">
        <button type="button" data-view="day">יום</button>
        <button type="button" data-view="week">שבוע</button>
      </div>
      <nav id="school-kids" class="filters" aria-label="בחירת ילד"></nav>
      <div id="school-scroller" class="scroller">
        <div id="school-head" class="cal-head"></div>
        <div id="school-body" class="cal-body"></div>
      </div>
    </section>

    <button id="add" class="fab" type="button" aria-label="הוספת אירוע">+</button>
    <div id="toast" class="toast" role="status" hidden></div>

    <nav class="tabbar" role="tablist">
      <button type="button" role="tab" data-tab="calendar"><span class="icon" aria-hidden="true">📅</span>יומן</button>
      <button type="button" role="tab" data-tab="school"><span class="icon" aria-hidden="true">🎒</span>מערכת שעות</button>
    </nav>
  </main>

  <dialog id="details" class="details">
    <form method="dialog">
      <div id="details-person" class="details-person"></div>
      <h2 id="details-title"></h2>
      <p id="details-when"></p>
      <p id="details-where"></p>
      <div id="details-actions" class="dialog-buttons" hidden>
        <button type="button" id="details-edit">עריכה</button>
        <button type="button" id="details-delete" class="danger">מחיקה</button>
      </div>
      <button class="details-close">סגירה</button>
    </form>
  </dialog>

  <dialog id="editor" class="details editor">
    <form id="editor-form" novalidate>
      <h2 id="editor-heading">אירוע חדש</h2>
      <label class="field">מה
        <input id="ed-title" maxlength="120" placeholder="למשל: יום הורים" autocomplete="off">
      </label>
      <div class="field">מי (אפשר כמה)
        <div id="ed-people" class="ed-people"></div>
      </div>
      <label class="field">תאריך
        <input id="ed-date" type="date">
      </label>
      <label class="check"><input id="ed-allday" type="checkbox"> כל היום</label>
      <div id="ed-times" class="ed-times">
        <!-- Our own 24-hour pickers: the phone's time field shows AM/PM in some regions -->
        <div class="field">משעה
          <div id="ed-start" class="clock" dir="ltr"><select aria-label="שעה"></select>:<select aria-label="דקות"></select></div>
        </div>
        <div class="field">עד
          <div id="ed-end" class="clock" dir="ltr"><select aria-label="שעה"></select>:<select aria-label="דקות"></select></div>
        </div>
      </div>
      <label class="field">איפה (לא חובה)
        <input id="ed-location" maxlength="200" autocomplete="off">
      </label>
      <p id="ed-warning" class="notice" hidden>האפליקציה עוד לא מחוברת למסד נתונים, ולכן אירועים שמוסיפים יימחקו כשהשרת יופעל מחדש. ההוראות לחיבור נמצאות ב-README.</p>
      <p id="ed-error" class="login-error" role="alert"></p>
      <div class="dialog-buttons">
        <button type="submit" class="primary">שמירה</button>
        <button type="button" id="ed-cancel">ביטול</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
